<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intermodal Booking Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #F6F6F6; --card: #FFFFFF; --text: #212121; --muted: #6B6B6B; --line: #E4E4E4;
    --accent: #2D3E50; --accent-text: #FFFFFF; --danger: #A61B1B;
    --vertt: #5B4BB7; --sbb: #B42318; --walk: #6B7280; --bus: #B7791F;
    --radius: 6px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #E9E9E9; color: var(--text); font: 15px/1.45 Inter, "Helvetica Neue", Arial, sans-serif;
         display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
  .phone { width: 390px; max-width: 100%; height: 820px; max-height: calc(100vh - 32px); background: var(--bg);
           border: 1px solid #D0D0D0; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
  .bar { background: var(--card); padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  .bar b { font-weight: 700; } .bar span { font-size: 12px; color: var(--muted); }
  .demo { font-size: 11px; text-align: center; color: var(--muted); padding: 4px; border-bottom: 1px solid var(--line); }
  .screen { flex: 1; overflow-y: auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; font-weight: 700; }
  h2 { font-size: 12px; margin: 18px 0 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 8px; }
  .card.click { cursor: pointer; } .card.cmp { color: var(--muted); }
  .btn { display: block; width: 100%; padding: 13px; border: 0; border-radius: var(--radius); background: var(--accent); color: var(--accent-text);
         font: inherit; font-weight: 600; cursor: pointer; margin-top: 10px; }
  .btn.secondary { background: var(--card); color: var(--text); border: 1px solid var(--line); }
  .btn.danger { background: var(--card); color: var(--danger); border: 1px solid var(--danger); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .field { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px; margin-bottom: 8px; position: relative; }
  .field label { display: block; font-size: 12px; color: var(--muted); }
  .field input { width: 100%; border: 0; background: transparent; font: inherit; font-weight: 600; color: var(--text); padding: 2px 0; outline: none; }
  .sugg { position: absolute; left: -1px; right: -1px; top: 100%; background: var(--card); border: 1px solid var(--line); z-index: 5; }
  .sugg div { padding: 8px 12px; border-top: 1px solid var(--line); cursor: pointer; font-size: 14px; }
  .row2 { display: flex; gap: 8px; } .row2 .field { flex: 1; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--card); }
  .seg button { flex: 1; padding: 9px 4px; border: 0; border-left: 1px solid var(--line); background: transparent; font: inherit; font-size: 13px; cursor: pointer; color: var(--text); }
  .seg button:first-child { border-left: 0; } .seg button.on { background: var(--accent); color: var(--accent-text); }
  .seg button:disabled { cursor: not-allowed; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .times { font-size: 17px; font-weight: 700; }
  .muted { color: var(--muted); font-size: 13px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 6px; border: 1px solid var(--accent); border-radius: 3px; color: var(--accent); margin-right: 4px; }
  .tag.grey { border-color: var(--line); color: var(--muted); }
  .bars { display: flex; gap: 2px; margin: 8px 0; height: 4px; } .bars span { border-radius: 2px; }
  .leg { border-left: 3px solid; padding: 2px 0 10px 10px; margin-left: 4px; }
  .leg.walk { border-left-style: dashed; }
  .mode { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .gap { margin: 0 0 10px 17px; font-size: 13px; color: var(--muted); }
  .map { height: 210px; border-radius: var(--radius); border: 1px solid var(--line); margin-bottom: 8px; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .legend i { display: inline-block; width: 12px; height: 3px; vertical-align: middle; margin-right: 4px; }
  .sum { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; font-weight: 700; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); cursor: pointer; }
  .opt:first-child { border-top: 0; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
  .strike { text-decoration: line-through; color: var(--muted); }
  .center { text-align: center; padding-top: 120px; }
  .spinner { width: 40px; height: 40px; border: 4px solid var(--line); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 14px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .note { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; font-size: 13px; margin: 8px 0; }
  .modal { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; padding: 16px; }
  .modal > div { background: var(--card); border-radius: var(--radius); padding: 16px; width: 560px; max-width: 100%; max-height: 90vh; display: flex; flex-direction: column; }
  .modal pre { overflow: auto; background: var(--bg); padding: 10px; font-size: 12px; flex: 1; margin: 10px 0; }
</style>
</head>
<body>
<div class="phone">
  <div class="bar"><b id="app">Intermodal demo</b><span id="step"></span></div>
  <div class="demo">Mockup – all data made up</div>
  <div class="screen" id="screen"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
// ---------- Made-up data ----------
const ADDRESSES = ["Dorfstrasse 1, 8907 Wettswil am Albis", "Bernstrasse 10, 3072 Ostermundigen", "Bahnhofstrasse 1, 8001 Zürich",
                   "Pilatusstrasse 5, 6003 Luzern", "Marktgasse 2, 8400 Winterthur", "Dorfstrasse 20, 8907 Wettswil am Albis"];
const P = { home: [47.3416, 8.4708], zhb: [47.3779, 8.5403], thalwil: [47.2953, 8.5645], bonst: [47.3155, 8.4683],
            bern: [46.9490, 7.4393], wank: [46.9676, 7.4648], dest: [46.9565, 7.4870] };
const RAIL = [[47.3912, 8.4889], [47.3880, 8.1800], [47.3520, 7.9070], [47.2100, 7.6300], [47.0600, 7.5100]];
// half-fare train price (from OJP Fare), CO2 from OJP; Vertt legs: tariff from km + min
const TRIPS = [
  { id: "A", legs: [
    { kind: "vertt", from: "start", to: "Zürich HB", pick: "11:31", arr: "11:52", km: 13.2, min: 21, car: "VW Passat", year: 2013, g: 123, geo: [P.home, [47.36, 8.50], P.zhb] },
    { kind: "train", from: "Zürich HB", to: "Bern", dep: "12:02", arr: "12:58", line: "IC 8", pl: "Platform 31", half: 28.00, co2: 0.83, geo: [P.zhb, ...RAIL, P.bern] },
    { kind: "vertt", from: "Bern", to: "dest", pick: "13:00", arr: "13:13", km: 4.1, min: 13, car: "BMW 3 Series", year: 2020, g: 134, geo: [P.bern, [46.953, 7.462], P.dest] } ] },
  { id: "B", legs: [
    { kind: "vertt", from: "start", to: "Thalwil", pick: "11:31", arr: "11:47", km: 9.5, min: 16, car: "Renault Talisman", year: 2018, g: 120, geo: [P.home, [47.32, 8.52], P.thalwil] },
    { kind: "train", from: "Thalwil", to: "Bern Wankdorf", dep: "12:00", arr: "13:20", line: "IR 70", pl: "Platform 3", half: 22.40, co2: 0.84, geo: [P.thalwil, [47.17, 8.48], [47.05, 8.30], [46.98, 7.75], P.wank] },
    { kind: "walk", from: "Bern Wankdorf", to: "dest", dep: "13:20", arr: "13:32", km: 0.9, min: 12, geo: [P.wank, P.dest] } ] },
  { id: "C", legs: [
    { kind: "vertt", from: "start", to: "Bonstetten-Wettswil", pick: "11:31", arr: "11:39", km: 4.0, min: 8, car: "Renault Megane", year: 2015, g: 90, geo: [P.home, P.bonst] },
    { kind: "train", from: "Bonstetten-Wettswil", to: "Bern", dep: "11:52", arr: "13:24", line: "S5 / IR 15", pl: "Platform 1", half: 27.00, co2: 0.86, geo: [P.bonst, [47.25, 8.30], [47.10, 7.95], P.bern] },
    { kind: "vertt", from: "Bern", to: "dest", pick: "13:26", arr: "13:34", km: 3.5, min: 8, car: "Renault Megane", year: 2017, g: 95, geo: [P.bern, [46.952, 7.47], P.dest] } ] },
];
const CMP = { verttOnly: { dep: "11:31", arr: "13:06", km: 128, min: 95, g: 120 },
              ptOnly: { dep: "11:34", arr: "13:36", transfers: 3, half: 30.50, co2: 1.1 } };
const NAMES = { none: "No travelcard", half: "Half-fare", ga: "GA" };

// ---------- Helpers ----------
const r05 = x => Math.round(x * 20) / 20;
const chf = x => "CHF " + x.toFixed(2);
const kg = x => x == null ? "not available" : x.toFixed(1) + " kg";
const tariff = (km, min) => Math.max(10, 3 + 1.8 * km + 0.3 * min);
const trainPrice = half => S.card === "ga" ? 0 : S.card === "half" ? half : 2 * half;
const town = a => (a || "").split(", ").pop().replace(/^\d{4} /, "");
const toMin = t => +t.slice(0, 2) * 60 + +t.slice(3);
const seller = () => S.app === "vertt" ? "Vertt" : "SBB";
const stored = () => { try { return JSON.parse(localStorage.getItem("bookings") || "[]"); } catch { return []; } };
const store = list => { try { localStorage.setItem("bookings", JSON.stringify(list)); } catch {} };

// ---------- State ----------
let S, maps = [];
function reset() {
  S = { app: null, from: "", to: "", typing: null, date: "2026-10-06", time: "11:30", card: "half", swisspass: false, spFrom: null, spCard: null,
        searched: false, tooShort: false, sel: null, login: null, promo: 0, pay: null, screen: "app", booking: null };
  render();
}
function go(s) { S.screen = s; render(); }

// ---------- Trip calculation ----------
function legsOf(trip) {
  const f = 1 - S.promo / 100;
  return trip.legs.map(l => {
    const from = l.from === "start" ? town(S.from) : l.from, to = l.to === "dest" ? town(S.to) : l.to;
    if (l.kind === "vertt") { const base = r05(tariff(l.km, l.min)); return { ...l, from, to, base, price: r05(base * f), co2: l.km * l.g / 1000 }; }
    if (l.kind === "train") return { ...l, from, to, price: trainPrice(l.half), co2: l.co2 };
    return { ...l, from, to, price: 0, co2: 0 };
  });
}
function totals(trip) {
  const L = legsOf(trip);
  const first = L[0], last = L[L.length - 1];
  const dep = first.kind === "vertt" ? S.time : first.dep;
  return { L, dep, arr: last.arr, arrMin: toMin(last.arr), dur: toMin(last.arr) - toMin(dep), price: r05(L.reduce((s, l) => s + l.price, 0)),
           co2: L.reduce((s, l) => s + l.co2, 0), transfers: L.filter(l => l.kind === "train").length + L.length - 2 };
}
function labelled() {
  const T = TRIPS.map(t => ({ t, ...totals(t) }));
  const pick = (key, alt) => T.slice().sort((a, b) => a[key] - b[key] || a[alt] - b[alt])[0].t.id;
  const fast = pick("arrMin", "price"), cheap = pick("price", "arrMin"), green = pick("co2", "arrMin");
  const lab = { [fast]: [], [cheap]: [], [green]: [] };
  lab[fast].push("Fastest"); lab[cheap].push("Cheapest"); lab[green].push("Greenest");
  return T.filter(x => lab[x.t.id]).map(x => ({ ...x, labels: [...new Set(lab[x.t.id])] }));
}

// ---------- Settlement (PRD section 6) ----------
function events(b) {
  const vertt = b.legs.filter(l => l.operator === "Vertt").reduce((s, l) => s + l.amount_chf, 0);
  const train = b.legs.filter(l => l.operator === "SBB").reduce((s, l) => s + l.amount_chf, 0);
  const ev = [], add = (event_type, payer, payee, amount_chf, reason, refers_to_event = null) =>
    ev.push({ event_id: "ev-" + (ev.length + 1), seq: ev.length + 1, event_type, payer, payee, amount_chf: Math.round(amount_chf * 100) / 100, reason, refers_to_event });
  add("b2c_payment", "customer", b.seller, b.total, "Customer pays seller for the whole journey");
  if (b.seller === "Vertt" && train > 0) {
    add("b2b_transfer", "Vertt", "SBB", train, "Train ticket sold by Vertt");
    add("commission", "SBB", "Vertt", Math.round(Math.round(train * 100) / 20) / 100, "5 % sales commission, rounded half up");
  } else if (b.seller === "SBB" && vertt > 0) add("b2b_transfer", "SBB", "Vertt", vertt, "Vertt rides sold by SBB, no commission");
  if (b.status === "cancelled") {
    const orig = ev.slice();
    add("refund", b.seller, "customer", b.total, "Journey cancelled, full refund", "ev-1");
    orig.filter(e => e.event_type !== "b2c_payment").forEach(e => add("reversal", e.payee, e.payer, e.amount_chf, "Reversal of " + e.event_type, e.event_id));
  }
  return ev;
}
function linkData(b) {
  return { booking: { booking_id: b.id, system: S.app || b.system, status: b.status, customer: "demo-" + b.id.slice(-4), login_method: b.login,
                      travelcard: b.card, promo_percent: b.promo, payment_method: b.pay, booked_at: b.at },
           legs: b.legs, co2_total_kg: b.co2_total_kg, settlement_events: events(b) };
}

// ---------- Rendering ----------
const STEP = { app: "Step 0", swisspass: "SwissPass", plan: "Step 1", detail: "Step 1", login: "Step 2", overview: "Step 3", paying: "", receipt: "Receipt" };
function render() {
  maps.forEach(m => m.remove()); maps = [];
  document.getElementById("app").textContent = S.app ? (S.app === "vertt" ? "Vertt app" : "SBB app") : "Intermodal demo";
  document.getElementById("step").textContent = STEP[S.screen];
  const el = document.getElementById("screen");
  el.innerHTML = VIEWS[S.screen]();
  document.querySelectorAll("[data-map]").forEach(drawMap);
}
const COL = { vertt: "var(--vertt)", train: "var(--sbb)", walk: "var(--walk)" };
const HEX = { vertt: "#5B4BB7", train: "#B42318", walk: "#6B7280" };
const MODE = { vertt: "Vertt", train: "Train", walk: "Walk" };

function bars(L) { return `<div class="bars">${L.map(l => `<span style="flex:${l.min || toMin(l.arr) - toMin(l.dep)};background:${COL[l.kind]}"></span>`).join("")}</div>`; }
function legsHtml(L) {
  return L.map((l, i) => {
    const start = l.kind === "vertt" ? l.pick : l.dep;
    const next = L[i + 1];
    const wait = l.kind === "vertt" ? `<div class="gap">Car arrives ${i === 0 ? "5" : "2"} min after ${i === 0 ? "your departure time" : "the train"}</div>` : "";
    const gap = next ? `<div class="gap">Transfer ${toMin(next.kind === "vertt" ? next.pick : next.dep) - toMin(l.arr)} min</div>` : "";
    const detail = l.kind === "train" ? `${l.line} · ${l.pl}${S.card !== "none" ? " · " + (S.card === "ga" ? "covered by GA" : "half-fare price") : ""}`
                 : l.kind === "vertt" ? `Category Vertt · ${l.car} ${l.year} · ${l.g} g/km · ${l.km} km${S.promo ? ` · <span class="strike">${chf(l.base)}</span> −${S.promo} %` : ""}`
                 : `${l.km} km on foot`;
    return `${wait}<div class="leg ${l.kind}" style="border-color:${COL[l.kind]}">
      <div class="row"><span class="mode" style="color:${COL[l.kind]}">${MODE[l.kind]}</span><span>${chf(l.price)}</span></div>
      <div class="row"><b>${start} ${l.from}</b></div>
      <div class="muted">${detail} · ${l.min || toMin(l.arr) - toMin(l.dep)} min · CO₂ ${kg(l.co2)}</div>
      <div><b>${l.arr} ${l.to}</b></div></div>${gap}`;
  }).join("");
}
function mapHtml() {
  return `<div class="map" data-map></div><div class="legend"><span><i style="background:var(--vertt)"></i>Vertt</span>
    <span><i style="background:var(--sbb)"></i>Train</span><span><i style="background:var(--walk)"></i>Walk</span></div>`;
}
function drawMap(div) {
  const trip = TRIPS.find(t => t.id === S.sel);
  const m = L.map(div, { zoomControl: false });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "© OpenStreetMap" }).addTo(m);
  const all = [];
  trip.legs.forEach(l => { L.polyline(l.geo, { color: HEX[l.kind], weight: 4, dashArray: l.kind === "walk" ? "6 6" : null }).addTo(m); all.push(...l.geo); });
  [trip.legs[0].geo[0], ...trip.legs.map(l => l.geo[l.geo.length - 1])].forEach(p =>
    L.circleMarker(p, { radius: 5, color: "#212121", weight: 2, fillColor: "#fff", fillOpacity: 1 }).addTo(m));
  m.fitBounds(all, { padding: [16, 16] }); maps.push(m);
}
function addrField(key, label) {
  const v = S[key], open = S.typing === key;
  const list = open ? ADDRESSES.filter(a => a.toLowerCase().includes(v.toLowerCase())).slice(0, 4) : [];
  return `<div class="field"><label>${label}</label>
    <input value="${v}" placeholder="Enter an address" oninput="S.${key}=this.value;S.typing='${key}';S.searched=false;S.pick_${key}=false;rerenderKeep('${key}')">
    ${list.length ? `<div class="sugg">${list.map(a => `<div onmousedown="S.${key}='${a}';S.pick_${key}=true;S.typing=null;render()">${a}</div>`).join("")}</div>` : ""}</div>`;
}
function rerenderKeep(key) {
  const pos = document.activeElement.selectionStart; render();
  const inp = [...document.querySelectorAll(".field input")][key === "from" ? 0 : 1]; inp.focus(); inp.setSelectionRange(pos, pos);
}
function cardHtml(x) {
  return `<div class="card click" onclick="S.sel='${x.t.id}';go('detail')">
    <div>${x.labels.map(l => `<span class="tag">${l}</span>`).join("")}<span class="muted">Door to door with one booking</span></div>
    <div class="row" style="margin-top:6px"><span class="times">${x.dep} – ${x.arr}</span><span class="muted">${Math.floor(x.dur / 60)} h ${x.dur % 60} min · ${x.transfers} transfers</span></div>
    ${bars(x.L)}
    <div class="muted">${x.L.filter(l => l.kind === "vertt").map(l => `Car: ${l.car} · ${l.g} g/km`).join(" &nbsp;|&nbsp; ")}</div>
    <div class="row"><b>${chf(x.price)}</b><span class="muted">CO₂ ${kg(x.co2)}</span></div></div>`;
}

const VIEWS = {
  app: () => `<h1>Where do you book?</h1><p class="muted">Demo: the choice is fixed until you pay or reload.</p>
    <button class="btn" onclick="S.app='vertt';go('plan')">Vertt app</button>
    <button class="btn secondary" onclick="S.app='sbb';go('plan')">SBB app</button>`,

  plan: () => {
    const ready = S.pick_from && S.pick_to;
    let results = "";
    if (S.searched && S.tooShort) results = `<div class="note">Trip not suitable for intermodal journey</div>`;
    else if (S.searched) {
      const vo = CMP.verttOnly, pt = CMP.ptOnly;
      results = `<h2>Connections</h2>${labelled().map(cardHtml).join("")}
        <div class="card cmp"><div><span class="tag grey">For comparison</span>Vertt only</div>
          <div class="row" style="margin-top:6px"><span class="times">${S.time} – ${vo.arr}</span><span>direct</span></div>
          <div class="row"><b>${chf(r05(tariff(vo.km, vo.min)))}</b><span>CO₂ ${kg(vo.km * vo.g / 1000)}</span></div></div>
        <div class="card cmp"><div><span class="tag grey">For comparison</span>Public transport only</div>
          <div class="row" style="margin-top:6px"><span class="times">${pt.dep} – ${pt.arr}</span><span>${pt.transfers} transfers</span></div>
          <div class="row"><b>${chf(trainPrice(pt.half))}</b><span>CO₂ ${kg(pt.co2)}</span></div></div>`;
    }
    return `<h1>Plan your journey</h1>${addrField("from", "From")}${addrField("to", "To")}
      <div class="row2"><div class="field"><label>Depart at – date</label><input type="date" value="${S.date}" onchange="S.date=this.value;S.searched=false;render()"></div>
        <div class="field"><label>Time</label><input type="time" value="${S.time}" onchange="S.time=this.value;S.searched=false;render()"></div></div>
      <h2>Travelcard${S.swisspass ? " – from SwissPass" : ""}</h2>
      <div class="seg">${Object.keys(NAMES).map(c => `<button class="${S.card === c ? "on" : ""}" ${S.swisspass ? "disabled" : ""} onclick="S.card='${c}';render()">${NAMES[c]}</button>`).join("")}</div>
      ${S.swisspass ? "" : `<button class="btn secondary" onclick="S.spFrom='plan';go('swisspass')">Log in with SwissPass</button>`}
      <button class="btn" ${ready ? "" : "disabled"} onclick="search()">Search</button>${results}`;
  },

  detail: () => {
    const x = totals(TRIPS.find(t => t.id === S.sel));
    return `<h1>Your trip</h1>${mapHtml()}<div class="card">${legsHtml(x.L)}
      <div class="row sum"><span>Total · CO₂ ${kg(x.co2)}</span><span>${chf(x.price)}</span></div></div>
      <button class="btn" onclick="go(S.swisspass ? 'overview' : 'login')">Continue</button>
      <button class="btn secondary" onclick="go('plan')">Back to connections</button>`;
  },

  login: () => `<h1>Log in</h1><p class="muted">One click – nothing to type in the demo.</p>
    ${["Google", "Apple"].map(p => `<button class="btn secondary" onclick="S.login='${p.toLowerCase()}';go('overview')">Continue with ${p}</button>`).join("")}
    <button class="btn secondary" onclick="S.spFrom='login';go('swisspass')">Continue with SwissPass</button>
    <h2>Or with email</h2><div class="field"><label>Email</label><input value="demo@example.com" readonly></div>
    <div class="field"><label>Password</label><input type="password" value="demopassword" readonly></div>
    <button class="btn" onclick="S.login='email';go('overview')">Log in</button>`,

  overview: () => {
    const x = totals(TRIPS.find(t => t.id === S.sel));
    return `<h1>Overview</h1>${mapHtml()}<div class="card">${legsHtml(x.L)}
      <div class="row sum"><span>Total · CO₂ ${kg(x.co2)}</span><span>${chf(x.price)}</span></div></div>
      <div class="note">You pay <b>${seller()}</b> for the whole journey. Travelcard: <b>${NAMES[S.card]}</b></div>
      <h2>Promo code (Vertt rides)</h2><div class="list">${[5, 10, 20].map(p => `<label class="opt"><input type="checkbox" ${S.promo === p ? "checked" : ""}
        onchange="S.promo=this.checked?${p}:0;render()"> ${p} % off Vertt rides</label>`).join("")}</div>
      <h2>Payment method</h2><div class="list">${["Card", "TWINT", "Invoice", "Business"].map(m => `<label class="opt"><input type="radio" name="pay"
        ${S.pay === m.toLowerCase() ? "checked" : ""} onchange="S.pay='${m.toLowerCase()}';render()"> ${m}</label>`).join("")}</div>
      <button class="btn" ${S.pay ? "" : "disabled"} onclick="pay()">Pay ${chf(x.price)}</button>`;
  },

  swisspass: () => `<h1>SwissPass</h1><p class="muted">Demo login – nothing to type.</p>
    <div class="field"><label>Email</label><input value="demo@swisspass.example" readonly></div>
    <div class="field"><label>Password</label><input type="password" value="demopassword" readonly></div>
    ${S.spFrom === "plan" ? `<h2>Test profile</h2><div class="list">${Object.keys(NAMES).map(c => `<label class="opt"><input type="radio" name="sp"
      ${S.spCard === c ? "checked" : ""} onchange="S.spCard='${c}';render()"> ${NAMES[c]}</label>`).join("")}</div>` : ""}
    <button class="btn" ${S.spFrom === "plan" && !S.spCard ? "disabled" : ""} onclick="swissPassLogin()">Log in</button>
    <button class="btn secondary" onclick="go(S.spFrom)">Cancel</button>`,

  paying: () => `<div class="center"><div class="spinner"></div><b>Paying ${seller()} …</b></div>`,

  receipt: () => {
    const b = S.booking, n = stored().length;
    return `<h1>${b.status === "cancelled" ? "Cancelled" : "Paid"}</h1>
      <div class="muted">Booking ${b.id} · seller ${b.seller}</div>
      <div class="card" style="margin-top:10px"><b>${town(S.from)} – ${town(S.to)}</b>
        ${b.legs.map(l => `<div class="row"><span>${l.type === "train" ? "Train" : "Vertt"}</span><span>${chf(l.amount_chf)}</span></div>`).join("")}
        ${b.promo ? `<div class="muted">Promo ${b.promo} % on Vertt rides</div>` : ""}
        <div class="row sum"><span>Total</span><span>${chf(b.total)}</span></div>
        <div class="muted">Travelcard ${NAMES[b.card]} · payment ${b.pay} · login ${b.login}</div></div>
      ${b.status === "cancelled" ? `<div class="note">Refunded: <b>${chf(b.total)}</b></div>` : ""}
      <div class="note">Settlement data (for project partners)<br><a href="#" onclick="showData();return false">booking/${b.id}.json</a></div>
      ${b.status === "cancelled" ? "" : `<button class="btn danger" onclick="cancelJourney()">Cancel journey</button>`}
      <button class="btn secondary" onclick="reset()">New booking</button>
      <h2>Export (${n} booking${n === 1 ? "" : "s"} in this browser)</h2>
      <button class="btn secondary" onclick="exportAll()">Download all bookings</button>
      <button class="btn secondary" onclick="store([]);render()">Clear list</button>`;
  },
};

// ---------- Actions ----------
function swissPassLogin() {
  S.swisspass = true; S.login = "swisspass";
  if (S.spFrom === "plan") { S.card = S.spCard; go("plan"); } else go("overview");   // step 2 is done
}
function search() {
  S.tooShort = town(S.from) === town(S.to);
  S.searched = false; document.getElementById("screen").innerHTML = `<div class="center"><div class="spinner"></div><b>Searching connections …</b></div>`;
  setTimeout(() => { S.searched = true; render(); }, 1200);
}
function pay() {
  const x = totals(TRIPS.find(t => t.id === S.sel));
  const legs = x.L.filter(l => l.kind !== "walk").map((l, i) => ({ seq: i + 1, operator: l.kind === "vertt" ? "Vertt" : "SBB",
    type: l.kind === "vertt" ? "vertt_ride" : "train", amount_chf: l.price, co2_kg: Math.round(l.co2 * 100) / 100 }));
  S.booking = { id: "BK-" + Math.floor(100000 + Math.random() * 900000), at: new Date().toISOString(), seller: seller(), system: S.app,
                status: "paid", card: S.card, promo: S.promo, pay: S.pay, login: S.login, legs, total: x.price,
                co2_total_kg: Math.round(x.co2 * 100) / 100 };
  store([...stored(), linkData(S.booking)]);           // booking exists from the click on "Pay"
  go("paying"); setTimeout(() => go("receipt"), 1400);
}
function cancelJourney() {
  if (!confirm("Really cancel the whole journey?")) return;
  S.booking.status = "cancelled";
  store(stored().map(d => d.booking.booking_id === S.booking.id ? linkData(S.booking) : d));
  render();
}
function showData() {
  const json = JSON.stringify(linkData(S.booking), null, 2), m = document.createElement("div");
  m.className = "modal";
  m.innerHTML = `<div><b>Settlement data – ${S.booking.id}</b><pre></pre><button class="btn" id="copy">Copy</button><button class="btn secondary" id="close">Close</button></div>`;
  m.querySelector("pre").textContent = json;
  m.querySelector("#copy").onclick = e => navigator.clipboard.writeText(json).then(() => e.target.textContent = "Copied");
  m.querySelector("#close").onclick = () => m.remove();
  m.onclick = e => { if (e.target === m) m.remove(); };
  document.body.appendChild(m);
}
function exportAll() {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(stored(), null, 2)], { type: "application/json" }));
  a.download = "bookings.json"; a.click();
}

reset();
</script>
</body>
</html>
