<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intermodal Booking App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Funnel+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  /* design tokens from the designer's mockup (https://intermodal-demo.vercel.app) */
  :root {
    --black: #0A0A0A; --black-80: #3B3B3B; --text2: #6C6C6C; --placeholder: #9D9D9D; --text-disabled: #CECECE;
    --red: #DA291C; --red-dark: #AE2116; --red-20: #F8D4D2;
    --mist-200: #B8B9BA; --mist-100: #E6E7E8; --mist-80: #EBECED; --mist-60: #F0F1F1; --mist-40: #F5F5F6; --mist-20: #FAFAFA;
    --green: #03890E; --green-dark: #025909; --green-ring: #68B86F; --green-light: #DCEFDE;
    --orange-dark: #CC5900; --orange-ring: #FFB266; --orange-light: #FFEDDC;
    --error: #FF3B30; --error-dark: #A6261F; --error-ring: #FF8983; --error-light: #FFE4E2;
    --vertt: var(--black); --train: var(--red); --walk: var(--mist-200);
    --r-m: 4px; --r-l: 8px; --r-xl: 12px;
    --shadow-md: 0 2px 6px -1px #0000000f; --shadow-xl: 0 8px 24px -4px #0000001f;
    --font: "Funnel Sans", "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--mist-100); color: var(--black); font: 16px/1.4 var(--font);
         display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 32px; }
  .phone { position: relative; width: 390px; height: min(860px, calc(100vh - 64px)); background: #fff; border-radius: var(--r-xl);
           box-shadow: var(--shadow-xl), 0 0 0 1px var(--mist-60); overflow: hidden; display: flex; flex-direction: column; }
  @media (max-width: 500px) { body { padding: 0; } .phone { width: 100%; height: 100dvh; border-radius: 0; box-shadow: none; } }
  button { font-family: inherit; }

  /* header */
  .head { display: flex; align-items: center; gap: 8px; padding: 16px; border-bottom: 1px solid var(--mist-60); min-height: 57px; }
  .head .brand { flex: 1; display: flex; align-items: center; font-size: 20px; font-weight: 700; }
  .toggle { display: flex; align-items: center; gap: 4px; }
  .toggle > button:not(.switch) { background: none; border: 0; padding: 0; font-size: 16px; color: var(--text2); cursor: pointer; }
  .toggle > button.on { color: var(--black); font-weight: 700; }
  .switch { width: 52px; height: 28px; border-radius: 14px; border: 0; background: var(--black); position: relative; cursor: pointer; transition: background .2s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 30px; height: 22px; border-radius: 11px; background: #fff; transition: transform .2s; }
  .switch[aria-checked="true"] { background: var(--red); } .switch[aria-checked="true"]::after { transform: translateX(16px); }
  .iconbtn { background: none; border: 0; padding: 0; cursor: pointer; display: flex; color: var(--black); }

  /* screen */
  .screen { flex: 1; overflow-y: auto; padding: 24px 16px 0; display: flex; flex-direction: column; }
  .foot { position: sticky; bottom: 0; margin-top: auto; background: #fff; padding: 16px 0; display: flex; flex-direction: column; gap: 12px; }
  .foot.row { flex-direction: row; } .foot.row .btn { flex: 1; } .foot.static { position: static; }
  .stack { display: flex; flex-direction: column; gap: 12px; }
  .titlerow { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
  h1 { font-size: 24px; line-height: 30px; margin: 0; font-weight: 700; }
  h2 { font-size: 20px; line-height: 26px; margin: 8px 0 0; font-weight: 700; }
  .sub { color: var(--text2); margin: 4px 0 0; }
  .muted { color: var(--text2); font-size: 14px; }
  .xs { font-size: 12px; }
  section { margin-top: 16px; }

  /* buttons */
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; height: 52px; padding: 0 16px; border: 0; border-radius: var(--r-m);
         background: var(--black); color: #fff; font-size: 18px; font-weight: 700; cursor: pointer; text-decoration: none; flex-shrink: 0; }
  .btn:hover:not(:disabled) { background: var(--black-80); }
  .btn:disabled { background: var(--mist-80); color: var(--text-disabled); cursor: not-allowed; }
  .btn.outline { background: #fff; color: var(--black); box-shadow: inset 0 0 0 1px var(--black); }
  .btn.outline:hover:not(:disabled) { background: var(--mist-20); }
  .btn.grey { background: var(--mist-100); color: var(--black); } .btn.grey:hover:not(:disabled) { background: var(--mist-200); }
  .btn.danger { background: var(--error); } .btn.danger:hover:not(:disabled) { background: var(--error-dark); }
  .btn.m { height: 44px; font-size: 16px; }
  .btn img { width: 24px; height: 24px; }
  .link { background: none; border: 0; padding: 0; font-size: 16px; font-weight: 700; color: var(--black); text-decoration: underline; cursor: pointer; white-space: nowrap; }
  .link.s { font-size: 14px; } .link.muted { color: var(--text2); font-weight: 500; }
  .center { text-align: center; }

  /* form fields */
  .fgroup { position: relative; margin-top: 16px; }
  .fgroup > label, .lbl { display: block; font-size: 14px; font-weight: 500; color: var(--text2); margin-bottom: 8px; }
  .lblrow { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .lblrow .lbl { margin: 0; }
  .input { display: flex; align-items: center; gap: 8px; min-height: 48px; padding: 0 16px; border-radius: var(--r-m); background: var(--mist-40);
           box-shadow: inset 0 0 0 1px var(--mist-60); cursor: text; position: relative; }
  .input:hover { box-shadow: inset 0 0 0 1px var(--black); }
  .input:focus-within, .input.open { background: #fff; box-shadow: inset 0 0 0 2px var(--black); }
  .input.err { box-shadow: inset 0 0 0 1px var(--error); } .input.err:focus-within { box-shadow: inset 0 0 0 2px var(--error); }
  .input.ro, .input.ro:hover { box-shadow: inset 0 0 0 1px var(--mist-60); background: var(--mist-40); cursor: default; }
  .input input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; color: var(--black); padding: 12px 0; outline: none; }
  .input input::placeholder { color: var(--placeholder); }
  .input.ro input { color: var(--placeholder); }
  .input svg { flex-shrink: 0; }
  .input.open .chev { transform: rotate(180deg); }
  .input button.datebtn { flex: 1; text-align: left; border: 0; background: none; font: inherit; color: var(--black); padding: 12px 0; cursor: pointer; }
  .input input[type=time]::-webkit-calendar-picker-indicator { opacity: 0; position: absolute; right: 12px; width: 28px; height: 28px; cursor: pointer; }
  .help { font-size: 12px; color: var(--text2); margin-top: 4px; } .help.err { color: var(--error-dark); } .help:empty { display: none; }
  .hint { display: flex; align-items: center; gap: 4px; color: var(--text2); font-size: 14px; margin-top: 12px; }
  .row2 { display: flex; gap: 12px; } .row2 > .fgroup { flex: 1; min-width: 0; }

  /* address suggestions */
  .sugg { position: absolute; left: 0; right: 0; top: calc(100% + 4px); background: #fff; border-radius: var(--r-l); box-shadow: var(--shadow-xl), 0 0 0 1px var(--mist-60); z-index: 600; padding: 4px; }
  .sugg button { display: flex; gap: 8px; align-items: center; width: 100%; padding: 8px 12px; border: 0; background: none; text-align: left; border-radius: var(--r-m); cursor: pointer; font: inherit; color: var(--black); }
  .sugg button:hover { background: var(--mist-40); }
  .sugg .pin { color: var(--red); } .sugg small { display: block; font-size: 12px; color: var(--text2); }
  .sugg .none { padding: 8px 12px; color: var(--text2); font-size: 14px; }

  /* calendar */
  .cal { position: absolute; left: 0; top: calc(100% + 4px); width: calc(200% + 12px); background: #fff; border-radius: var(--r-l); box-shadow: var(--shadow-xl), 0 0 0 1px var(--mist-60); z-index: 600; padding: 16px; }
  .cal .mon { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 20px; margin-bottom: 8px; }
  .cal .mon button:disabled { opacity: .25; cursor: default; }
  .cal .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; text-align: center; }
  .cal .grid span { font-size: 14px; color: var(--text2); padding: 4px 0; }
  .cal .grid button { height: 36px; border: 0; background: none; border-radius: var(--r-m); font: inherit; cursor: pointer; color: var(--black); }
  .cal .grid button:hover:not(:disabled) { background: var(--mist-40); }
  .cal .grid button:disabled { color: var(--text-disabled); cursor: default; }
  .cal .grid button.today { font-weight: 700; }
  .cal .grid button.sel { background: var(--red); color: #fff; }

  /* segmented selector */
  .seg { display: flex; padding: 4px; background: var(--mist-40); border-radius: var(--r-m); }
  .seg button { flex: 1; height: 40px; border: 0; background: none; border-radius: var(--r-m); font: inherit; font-size: 16px; color: var(--text2); cursor: pointer; }
  .seg button.on { background: var(--black); color: #fff; font-weight: 500; }
  .locked { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }

  /* chips, alerts, cards */
  .chip { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; padding: 2px 8px; border-radius: var(--r-m); font-size: 12px; font-weight: 700; background: var(--mist-100); color: var(--black); }
  .chip.green { background: var(--green-light); color: var(--green); }
  .alert { display: flex; gap: 8px; align-items: flex-start; padding: 12px 16px; border-radius: var(--r-l); background: var(--mist-20); box-shadow: inset 0 0 0 1px var(--mist-60); font-size: 14px; }
  .alert b { display: block; font-size: 16px; font-weight: 500; } .alert p { margin: 2px 0 0; color: var(--text2); }
  .alert > div { flex: 1; } .alert svg { flex-shrink: 0; }
  .alert.success { background: var(--green-light); box-shadow: inset 0 0 0 1px var(--green-ring); color: var(--green-dark); }
  .alert.warning { background: var(--orange-light); box-shadow: inset 0 0 0 1px var(--orange-ring); color: var(--orange-dark); }
  .alert.error { background: var(--error-light); box-shadow: inset 0 0 0 1px var(--error-ring); color: var(--error-dark); }
  .card { background: var(--mist-20); border-radius: var(--r-l); box-shadow: inset 0 0 0 1px var(--mist-60); padding: 16px; }
  .card.white { background: #fff; }
  .between { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .price { display: inline-flex; align-items: baseline; gap: 4px; white-space: nowrap; }
  .price small { font-size: 12px; } .price b { font-size: 18px; } .price.l b { font-size: 24px; }
  .price.was { color: var(--text2); text-decoration: line-through; } .price.was b { font-size: 16px; }
  s { color: var(--text2); }

  /* trip cards on the results screen */
  .trip { cursor: pointer; transition: box-shadow .15s; } .trip:hover { box-shadow: inset 0 0 0 1px var(--mist-200); }
  .trip .top { display: flex; align-items: center; gap: 8px; color: var(--text2); }
  .trip .tags { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; } .trip .tags > span:not(.chip) { white-space: nowrap; }
  .trip .top .iconbtn { margin-left: auto; color: var(--mist-200); }
  .trip .times { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-top: 8px; }
  .trip .times b { font-size: 20px; } .trip .times span { color: var(--text2); font-size: 14px; }
  .trip.cmp { cursor: default; } .trip.cmp:hover { box-shadow: inset 0 0 0 1px var(--mist-60); }
  .trip.cmp .times b, .trip.cmp .price, .trip.cmp .bottom > span { color: var(--text-disabled); }
  .trip.cmp .times span { color: var(--mist-200); }
  .trip .bottom { display: flex; justify-content: space-between; align-items: baseline; margin-top: 12px; font-size: 14px; }
  .legbar { display: flex; gap: 6px; margin: 16px 2px 4px; }
  .legbar span { position: relative; height: 10px; }
  .legbar span::before { content: ""; position: absolute; left: 0; right: 0; top: 3px; height: 4px; border-radius: 2px; background: var(--c); }
  .legbar i { position: absolute; top: 0; width: 10px; height: 10px; border-radius: 50%; background: #fff; box-shadow: inset 0 0 0 2px var(--c); }
  .legbar i.s { left: -2px; } .legbar i.e { right: -2px; } .legbar i.f { background: var(--c); }
  .legs-mini { list-style: none; margin: 12px 0 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
  .legs-mini li { display: flex; gap: 8px; } .legs-mini small { display: block; color: var(--text2); font-size: 12px; }

  /* legs on the details and overview screens */
  .legs { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .leg { background: var(--mist-20); border-left: 2px solid var(--c); border-radius: 0 var(--r-m) var(--r-m) 0; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
  .leg.walk { border-left-style: dashed; }
  .leg .line { display: flex; gap: 8px; align-items: flex-start; } .leg .line small { display: block; color: var(--text2); font-size: 14px; margin-top: 2px; }
  .gap { display: flex; gap: 8px; align-items: center; font-size: 16px; }
  .map { height: 210px; border-radius: var(--r-l); box-shadow: 0 0 0 1px var(--mist-60); z-index: 0; }
  .legend { display: flex; gap: 20px; justify-content: center; font-size: 14px; color: var(--text2); margin-top: 8px; }
  .legend i { display: inline-block; width: 16px; height: 0; border-top: 3px solid; vertical-align: middle; margin-right: 6px; }

  /* payment */
  .radio { display: flex; align-items: center; gap: 12px; padding: 8px 0; cursor: pointer; }
  .radio input { appearance: none; width: 22px; height: 22px; margin: 0; border-radius: 50%; box-shadow: inset 0 0 0 2px var(--black); cursor: pointer; }
  .radio input:checked { box-shadow: inset 0 0 0 2px var(--red), inset 0 0 0 6px #fff; background: var(--red); }
  .radio .chip { margin-left: auto; font-weight: 500; }
  .paygrid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .paygrid button { aspect-ratio: 70 / 48; border: 0; padding: 0; border-radius: 6px; background: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font: inherit; }
  .paygrid button img { width: 100%; height: 100%; display: block; }
  .paygrid button.on { box-shadow: 0 0 0 2px var(--red); }
  .paygrid .pf { background: #FFCC00; box-shadow: inset 0 0 0 1px #D9D9D9; font-weight: 700; font-size: 13px; color: var(--black); line-height: 1.1; }

  /* overlays */
  .overlay { position: absolute; inset: 0; background: #000a; z-index: 1000; display: flex; align-items: flex-end; animation: fade .15s; }
  .overlay.mid { align-items: center; padding: 24px; }
  .sheet { width: 100%; max-height: 85%; background: var(--mist-60); border-radius: 24px 24px 0 0; padding: 12px 24px 24px; display: flex; flex-direction: column; gap: 16px; animation: up .2s ease-out; }
  .sheet::before { content: ""; align-self: center; width: 36px; height: 4px; border-radius: 2px; background: var(--mist-200); }
  .modal { width: 100%; max-height: 100%; background: #fff; border-radius: var(--r-xl); padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .modal pre { margin: 0; flex: 1; min-height: 120px; overflow: auto; background: var(--mist-40); border-radius: var(--r-m); padding: 12px; font-size: 12px; }
  @keyframes fade { from { opacity: 0; } } @keyframes up { from { transform: translateY(40px); opacity: 0; } }

  /* loading */
  .loading { text-align: center; padding-top: 48px; }
  .spinner { width: 72px; height: 72px; border: 6px solid var(--mist-60); border-top-color: var(--red); border-right-color: var(--red); border-bottom-color: var(--red);
             border-radius: 50%; margin: 0 auto 32px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* landing illustration */
  .hero { display: block; width: 100%; height: auto; margin: 24px 0 8px; overflow: visible; }
  .hero .draw { stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.4s ease-out .2s forwards; }
  .hero .pop { opacity: 0; animation: show .4s ease-out 1.2s forwards; }
  @keyframes draw { to { stroke-dashoffset: 0; } } @keyframes show { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .hero .draw { animation: none; stroke-dashoffset: 0; } .hero .pop { animation: none; opacity: 1; } }
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="head" id="head"></div>
  <div class="screen" id="screen"></div>
  <div id="layer"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="assets.js"></script>
<script>
const NAMES = { none: "No travelcard", half: "Half-fare", ga: "GA" };
const PAY = { twint: "TWINT", invoice: "Invoice", visa: "Visa", mastercard: "Mastercard", amex: "American Express", postfinance: "PostFinance Card",
              paypal: "PayPal", apple_pay: "Apple Pay", google_pay: "Google Pay" };
const MORE_PAY = ["visa", "mastercard", "amex", "postfinance", "paypal", "apple_pay", "google_pay"];   // the "More options" sheet
const HEX = { vertt: "#0A0A0A", train: "#DA291C", walk: "#B8B9BA" };
const COL = { vertt: "var(--vertt)", train: "var(--train)", walk: "var(--walk)" };
const MODE = { vertt: "Vertt", train: "Train", walk: "Walk" };
const LEG_ICON = { vertt: "car", train: "sbb", walk: "walk" };

// ---------- helpers ----------
const r05 = x => Math.round(x * 20) / 20;
const chf = x => "CHF " + Number(x).toFixed(2);
const kg = x => x == null ? "not available" : Number(x).toFixed(1) + " kg";
const hm = iso => iso ? iso.slice(11, 16) : "";
const mins = (a, b) => Math.round((new Date(b) - new Date(a)) / 60000);
const dur = m => m >= 60 ? `${Math.floor(m / 60)} h ${m % 60} min` : `${m} min`;
const transfers = n => `${n} transfer${n === 1 ? "" : "s"}`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const seller = () => S.app === "vertt" ? "Vertt" : "SBB";
const ids = () => { try { return JSON.parse(localStorage.getItem("bookings") || "[]"); } catch { return []; } };
const saveIds = list => { try { localStorage.setItem("bookings", JSON.stringify(list)); } catch {} };
const pad = n => String(n).padStart(2, "0");
const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const icon = (name, size = 24, cls = "") => `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" aria-hidden="true">${ICONS[name]}</svg>`;
const price = (x, cls = "") => { const [, n] = chf(x).split(" "); return `<span class="price ${cls}"><small>CHF</small><b>${n}</b></span>`; };
const alertBox = (type, title, text = "", { ic = type === "success" ? "wallet" : "info-circle", close = "" } = {}) =>
  `<div class="alert ${type}" role="${type === "error" ? "alert" : "status"}">${icon(ic, 20)}<div><b>${esc(title)}</b>${text ? `<p>${esc(text)}</p>` : ""}</div>
   ${close ? `<button class="iconbtn" aria-label="Close" onclick="${close}">${icon("x", 20)}</button>` : ""}</div>`;
function dayLabel(date) {
  const today = new Date(), tomorrow = new Date(Date.now() + 864e5);
  if (date === ymd(today)) return "Today";
  if (date === ymd(tomorrow)) return "Tomorrow";
  return new Date(date + "T12:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short" });
}
const longDate = date => new Date(date + "T12:00").toLocaleDateString("en-GB", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
const route = () => `${esc(S.from.town)} → ${esc(S.to.town)}`;

const NO_SERVER = "Server not reachable – start dev_server.py and open http://localhost:8000";
async function api(path, body) {
  const ctrl = new AbortController(), timeout = setTimeout(() => ctrl.abort(), 30000);
  try {
    const r = await fetch(path, { signal: ctrl.signal, ...(body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {}) });
    const data = await r.json().catch(() => ({ status: "error", message: "The server gave no answer" }));
    return { ok: r.ok, data };
  } catch (e) {          // no server, opened as a file, or no answer within 30 s
    return { ok: false, data: { status: "error", message: e.name === "AbortError" ? "The search took too long, please try again" : NO_SERVER } };
  } finally { clearTimeout(timeout); }
}

// ---------- state ----------
let S, maps = [], timer = null;
function reset() {
  const t = new Date(Date.now() + 15 * 60000); t.setMinutes(Math.ceil(t.getMinutes() / 15) * 15, 0, 0);
  const empty = () => ({ text: "", pos: null, town: "" });
  S = { app: "vertt", from: empty(), to: empty(), sugg: { from: [], to: [] }, notFound: {},
        date: ymd(t), time: `${pad(t.getHours())}:${pad(t.getMinutes())}`, cal: null,
        card: "half", swisspass: false, spFrom: null, spCard: "half", login: null, promoText: "", promo: 0, pay: null, morePay: null,
        screen: "app", result: null, error: null, sel: null, open: {}, booking: null, layer: null, sheetPick: null, copied: null };
  render();
}
function go(s) { S.screen = s; S.layer = null; render(); document.getElementById("screen").scrollTop = 0; }
const trip = () => S.result.trips[S.sel];

// ---------- prices (preview; the server recalculates when booking) ----------
function legPrice(l) { return l.kind === "vertt" ? r05(l.price_chf * (1 - S.promo / 100)) : 0; }
function trainPrice(t) { return S.card === "ga" ? 0 : S.card === "half" ? r05(t.train_price_half_chf) : r05(2 * t.train_price_half_chf); }
function total(t) { return r05(t.legs.reduce((s, l) => s + legPrice(l), 0) + trainPrice(t)); }

// ---------- rendering ----------
function render() {
  const a = document.activeElement, keep = a && a.dataset && a.dataset.keep ? [a.id, a.selectionStart] : null;
  maps.forEach(m => m.remove()); maps = [];
  document.getElementById("head").innerHTML = headHtml();
  document.getElementById("screen").innerHTML = VIEWS[S.screen]();
  document.getElementById("layer").innerHTML = S.layer ? LAYERS[S.layer]() : "";
  document.querySelectorAll("[data-map]").forEach(drawMap);
  if (keep) { const el = document.getElementById(keep[0]); if (el) { el.focus(); try { el.setSelectionRange(keep[1], keep[1]); } catch {} } }
}
function headHtml() {
  if (S.screen === "app") return `<span class="brand">Vertt × SBB</span>
    <div class="toggle"><button class="${S.app === "vertt" ? "on" : ""}" aria-pressed="${S.app === "vertt"}" onclick="S.app='vertt';render()">Vertt</button>
      <button class="switch" role="switch" aria-checked="${S.app === "sbb"}" aria-label="Use the SBB app" onclick="S.app=S.app==='sbb'?'vertt':'sbb';render()"></button>
      <button class="${S.app === "sbb" ? "on" : ""}" aria-pressed="${S.app === "sbb"}" onclick="S.app='sbb';render()">SBB</button></div>`;
  const close = S.screen === "swisspass" ? `<button class="iconbtn" aria-label="Close" onclick="go(S.spFrom)">${icon("x")}</button>` : "";
  return `<span class="brand">${S.app === "vertt" ? VERTT_LOGO : SBB_LOGO}</span>${close}`;
}

function legBar(legs) {
  const shown = legs.filter(l => COL[l.kind]);
  return `<div class="legbar">${shown.map((l, i) => `<span style="flex:${Math.max(4, minutesOf(l))};--c:${COL[l.kind]}">
    <i class="s ${i === 0 ? "f" : ""}"></i><i class="e ${i === shown.length - 1 ? "f" : ""}"></i></span>`).join("")}</div>`;
}
function minutesOf(l) {
  if (l.kind === "vertt") return l.ride_time_min;
  if (l.kind === "train") return mins(l.departure, l.arrival);
  return l.minutes || 0;
}
const place = (name, side) => esc(name === "start" ? S.from.town : name === "destination" ? S.to.town : name);
const modes = legs => [...new Set(legs.map(l => l.kind).filter(k => k === "vertt" || k === "train"))].map(k => MODE[k]).join(" + ");

function trainNote(t) { return S.card === "ga" ? "covered by GA" : S.card === "half" ? "half-fare price" : ""; }
function legsHtml(t, withPromo) {
  let trainShown = false, prev = null;
  const out = t.legs.map(l => {
    let gap = "";
    if (l.kind === "transfer") { prev = l; return `<li class="gap">${icon("info-circle", 20)}Transfer ${Math.round(l.minutes)} min</li>`; }
    if (l.kind === "vertt") gap = `<li class="gap">${icon("info-circle", 20)}Car arrives ${l.wait_min} minutes after ${l.from === "start" ? "your departure time" : "the train"}</li>`;
    else if (l.kind === "train" && prev && prev.kind !== "transfer" && prev.kind !== "train") {
      const m = mins(prev.arrival, l.departure);
      if (m > 0) gap = `<li class="gap">${icon("info-circle", 20)}Transfer ${m} min</li>`;
    }
    prev = l;
    let body;
    if (l.kind === "vertt") {
      const p = withPromo && S.promo ? `<s>${chf(l.price_chf)}</s> ${chf(legPrice(l))}` : chf(l.price_chf);
      body = `<b>${hm(l.pickup)} ${place(l.from)}</b>
        <div class="line">${icon("car", 20)}<div>Vertt - ${esc(l.car.make)} ${esc(l.car.model)} ${l.car.year}
          <small>Category Vertt · ${l.distance_km.toFixed(1)} km · ${Math.round(minutesOf(l))} min · ${p} · CO₂ ${kg(l.co2_kg)} · ${l.car.co2_g_per_km} g/km</small></div></div>
        <b>${hm(l.arrival)} ${place(l.to)}</b>`;
    } else if (l.kind === "train") {
      const note = trainNote(t), p = trainShown ? "" : ` · ${chf(trainPrice(t))}${note ? ` (${note})` : ""}`;
      trainShown = true;
      body = `<div class="line">${icon("sbb", 20)}<div>Train - ${esc(l.line)} - ${esc(l.from)} → ${esc(l.to)}
        <small>${hm(l.departure)} – ${hm(l.arrival)}${p} · CO₂ ${kg(l.co2_kg)}${l.platform ? " · Platform " + esc(l.platform) : ""}</small></div></div>`;
    } else {
      body = `<div class="line">${icon("walk", 20)}<div>Walk ${Math.round(minutesOf(l))} min<small>${(l.distance_km).toFixed(1)} km on foot</small></div></div>`;
    }
    return `${gap}<li class="leg ${l.kind}" style="--c:${COL[l.kind]}">${body}</li>`;
  });
  return `<ol class="legs">${out.join("")}</ol>`;
}
function mapHtml() {
  return `<div><div class="map" data-map></div><div class="legend"><span><i style="border-color:var(--vertt)"></i>Vertt</span>
    <span><i style="border-color:var(--train)"></i>Train</span><span><i style="border-color:var(--walk);border-top-style:dashed"></i>Walk</span></div></div>`;
}
function drawMap(div) {
  const m = L.map(div, { zoomControl: false });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "© OpenStreetMap" }).addTo(m);
  const all = [];
  trip().legs.forEach(l => {
    if (!l.route || l.route.length < 2) return;
    L.polyline(l.route, { color: HEX[l.kind], weight: 4, dashArray: l.kind === "walk" ? "4 6" : null }).addTo(m);
    all.push(...l.route);
  });
  [S.from.pos, S.to.pos].forEach(p => L.circleMarker(p, { radius: 6, color: "#0A0A0A", weight: 2, fillColor: "#fff", fillOpacity: 1 }).addTo(m));
  const fit = () => { if (!div.clientWidth) return; m.invalidateSize(); m.fitBounds(all.length ? all : [S.from.pos, S.to.pos], { padding: [16, 16] }); };
  fit();
  new ResizeObserver(fit).observe(div);     // fit again once the map has a real size (e.g. page was in a background tab)
  maps.push(m);
}

}
function calHtml() {
  const { y, m } = S.cal, first = new Date(y, m, 1), today = ymd(new Date()), now = new Date();
  const lead = (first.getDay() + 6) % 7, days = new Date(y, m + 1, 0).getDate();
  const cells = Array(lead).fill("<i></i>").concat(Array.from({ length: days }, (_, i) => {
    const d = ymd(new Date(y, m, i + 1));
    return `<button ${d < today ? "disabled" : ""} class="${d === S.date ? "sel" : ""} ${d === today ? "today" : ""}" onclick="S.date='${d}';S.cal=null;S.result=null;render()">${i + 1}</button>`;
  }));
  const atStart = y === now.getFullYear() && m === now.getMonth();
  return `<div class="cal" role="dialog" aria-label="Choose a date"><div class="mon">
      <button class="iconbtn" aria-label="Previous month" ${atStart ? "disabled" : ""} onclick="moveCal(-1)">${icon("chevron-left")}</button>
      ${first.toLocaleDateString("en-GB", { month: "long", year: "numeric" })}
      <button class="iconbtn" aria-label="Next month" onclick="moveCal(1)">${icon("chevron-right")}</button></div>
    <div class="grid">${["M", "T", "W", "T", "F", "S", "S"].map(d => `<span>${d}</span>`).join("")}${cells.join("")}</div></div>`;
}
function travelcardHtml(where) {
  if (S.swisspass) return `<div class="lblrow"><span class="lbl">Travelcard</span><button class="link s" onclick="removeSwissPass()">Remove</button></div>
    <div class="locked"><span>${NAMES[S.card]}</span><span class="chip green">from SwissPass</span></div>`;
  const seg = `<div class="seg" role="radiogroup" aria-label="Travelcard">${Object.keys(NAMES).map(c =>
    `<button role="radio" aria-checked="${S.card === c}" class="${S.card === c ? "on" : ""}" onclick="S.card='${c}';render()">${NAMES[c]}</button>`).join("")}</div>`;
  return where === "results"
    ? `<div class="lblrow"><span class="lbl">Travelcard</span><button class="link s" onclick="S.spFrom='results';S.spCard=S.card;go('swisspass')">Log in with SwissPass</button></div>${seg}`
    : `<span class="lbl">Travelcard</span>${seg}<button class="btn outline m" style="margin-top:12px" onclick="S.spFrom='plan';S.spCard=S.card;go('swisspass')">Log in with SwissPass</button>`;
}
function planAlert() {
  const e = S.error;
  if (!e) return "";
  if (e.status === "too_many_searches") return alertBox("warning", "Too many searches, please wait a moment", "", { close: "S.error=null;render()" });
  if (e.status === "past_time") return alertBox("warning", e.message, "", { close: "S.error=null;render()" });
  return alertBox("error", "Search failed", e.message, { close: "S.error=null;render()" });
}

// ---------- result cards ----------
function cardHtml(t, i) {
  const open = S.open[i], labels = t.labels[S.card];
  let trainShown = false;
  const mini = t.legs.filter(l => COL[l.kind]).map(l => {
    if (l.kind === "vertt") return `<li>${icon("car", 20)}<div>Vertt - ${esc(l.car.make)} ${esc(l.car.model)}<small>${l.distance_km.toFixed(1)} km · ${Math.round(l.ride_time_min)} min ·${chf(l.price_chf)} · ${kg(l.co2_kg)} · ${l.car.co2_g_per_km} g/km</small></div></li>`;
    if (l.kind === "train") { const p = trainShown ? "" : ` · ${chf(trainPrice(t))}`; trainShown = true;
      return `<li>${icon("sbb", 20)}<div>Train - ${esc(l.line)} - ${esc(l.from)} → ${esc(l.to)}<small>${hm(l.departure)} – ${hm(l.arrival)}${p} · ${kg(l.co2_kg)}</small></div></li>`; }
    return `<li>${icon("walk", 20)}<div>Walk ${Math.round(minutesOf(l))} min<small>${l.distance_km.toFixed(1)} km on foot</small></div></li>`;
  }).join("");
  return `<div class="card trip" role="button" tabindex="0" onclick="S.sel=${i};go('detail')" onkeydown="if(event.key==='Enter'){S.sel=${i};go('detail')}">
    <div class="top"><div class="tags">${labels.map(l => `<span class="chip ${l === "Greenest" ? "green" : ""}">${l}</span>`).join("")}<span>${modes(t.legs)}</span></div>
      <button class="iconbtn" aria-label="${open ? "Hide" : "Show"} legs" aria-expanded="${!!open}" onclick="event.stopPropagation();S.open[${i}]=!S.open[${i}];render()">${icon(open ? "chevron-up" : "chevron-down")}</button></div>
    <div class="times"><b>${hm(t.departure)} – ${hm(t.arrival)}</b><span>${dur(t.duration_min)} - ${transfers(t.transfers)}</span></div>
    ${open ? `<ul class="legs-mini">${mini}</ul>` : legBar(t.legs)}
    <div class="bottom"><span>${t.co2_kg == null ? "CO₂ not available" : kg(t.co2_kg) + " CO₂"}</span>${price(t.price_chf[S.card])}</div></div>`;
}
function cmpHtml(title, dep, arr, detail, p, co2) {
  return `<div class="card trip cmp" aria-disabled="true"><div class="top"><span>${title}</span></div>
    <div class="times"><b>${hm(dep)} – ${hm(arr)}</b><span>${detail}</span></div>
    <div class="bottom"><span>${co2 == null ? "CO₂ not available" : kg(co2) + " CO₂"}</span>${price(p)}</div></div>`;
}
function resultsHtml() {
  const r = S.result;
  if (r.status === "not_suitable") return alertBox("warning", "Trip not suitable for intermodal journey", "Start and destination are less than 10 km apart. A direct Vertt ride is the better choice.");
  const vo = r.comparisons && r.comparisons.vertt_only, pt = r.comparisons && r.comparisons.public_transport_only;
  const shown = r.status === "ok" ? r.trips.map((t, i) => [t, i]).filter(([t]) => t.labels[S.card].length) : [];
  return `${r.status === "no_trip" ? alertBox("warning", "No trip found for this time", "Please choose another departure time.") : ""}
    ${shown.map(([t, i]) => cardHtml(t, i)).join("")}
    ${vo ? cmpHtml("Vertt only", vo.departure, vo.arrival, `${dur(mins(vo.departure, vo.arrival))} - direct`, vo.price_chf, vo.co2_kg) : ""}
    ${pt ? cmpHtml("Train only", pt.departure, pt.arrival, `${dur(mins(pt.departure, pt.arrival))} - ${transfers(pt.transfers)}`, pt.price_chf[S.card], pt.co2_kg) : ""}`;
}

function summaryCard(t, withPromo) {
  const sum = withPromo ? total(t) : t.price_chf[S.card];
  return `<div class="card white stack">
    <div class="between"><span>Travelcard · ${NAMES[S.card]}</span>${S.swisspass ? `<span class="chip green">from SwissPass</span>` : ""}</div>
    <div class="between"><h2 style="margin:0">Total</h2><span class="price">${withPromo && S.promo ? price(t.price_chf[S.card], "was") : ""}${price(sum, "l")}</span></div>
    ${withPromo && S.promo ? `<span>Promo on Vertt rides · −${chf(r05(t.price_chf[S.card] - sum))}</span>` : ""}
    <span>Total CO₂ · ${kg(t.co2_kg)}</span>
    <span class="muted">1 adult · 2nd class · all legs included</span></div>`;
}

    const radio = m => `<label class="radio"><input type="radio" name="pay" ${S.pay === m ? "checked" : ""} onchange="S.pay='${m}';render()">${PAY[m]}
      ${m === S.morePay ? `<span class="chip">Chosen</span>` : ""}</label>`;
    return `<h1>Overview &amp; Payment</h1><p class="sub">${route()} · ${dayLabel(S.date)} · ${hm(t.departure)} – ${hm(t.arrival)}</p>
      <section class="stack">${alertBox("", `You pay ${seller()} for the whole journey`, "", { ic: "wallet" })}
        ${mapHtml()}${legsHtml(t, true)}</section>
      <div class="fgroup"><label for="promo">Promo for Vertt rides</label><div class="input ${bad ? "err" : ""}">
        <input id="promo" data-keep="1" inputmode="numeric" maxlength="2" value="${esc(S.promoText)}" placeholder="Enter 5, 10, or 20 for a Vertt ride discount" oninput="promoTyped(this.value)"></div>
        <div class="help ${bad ? "err" : ""}">${bad ? "Enter 5, 10 or 20" : S.promo ? `${S.promo}% off your Vertt rides` : ""}</div></div>
      <section class="card"><h2 style="margin:0 0 4px">Payment method</h2>
        ${radio("twint")}${radio("invoice")}${S.morePay ? radio(S.morePay) : ""}
        <div class="center" style="margin-top:8px"><button class="link" onclick="S.sheetPick=S.morePay;S.layer='pay';render()">More options</button></div></section>
      <section>${summaryCard(t, true)}</section>
      ${S.error ? `<section>${alertBox("error", "Booking failed", S.error)}</section>` : ""}
      <div class="foot"><button class="btn" ${S.pay ? "" : "disabled"} aria-disabled="${!S.pay}" onclick="pay()">Pay ${chf(total(t))}</button></div>`; },

  paying: () => `<h1>Processing payment</h1><p class="sub">Please do not close this screen</p>
    <div class="loading" role="status"><div class="spinner"></div><h2>Confirming your journey</h2><p class="muted">Paying ${seller()} – this only takes a moment…</p></div>`,

  receipt: () => { const r = S.booking, b = r.booking, t = trip(), n = ids().length, gone = b.status === "cancelled";
    const before = r05(b.total_chf + (b.promo_chf || 0));
    return `<h1>Your trip was ${gone ? "cancelled" : "booked"}</h1>
      <p class="sub">${route()} · ${hm(t.departure)} – ${hm(t.arrival)}<br>${longDate(S.date)} · Booking ${b.booking_id} - ${b.system === "vertt" ? "Vertt" : "SBB"}</p>
      ${gone ? "" : `<div class="center" style="margin-top:12px"><button class="link" onclick="shareBooking()">${S.copied === "share" ? "Link copied" : "Share booking"}</button></div>`}
      <section class="stack">
        ${gone ? alertBox("warning", "Journey cancelled", `Refunded: ${chf(b.total_chf)} to your payment method.`) : alertBox("success", "Your payment was successful.")}
        <div class="card stack">
          ${r.legs.map(l => `<div class="between"><span>${l.type === "train" ? "Train" : "Vertt"}</span><span class="price">
            ${l.amount_before_promo_chf != null && l.amount_before_promo_chf !== l.amount_chf ? price(l.amount_before_promo_chf, "was") : ""}${price(l.amount_chf)}</span></div>`).join("")}
          ${b.promo_percent ? `<div class="between"><span class="muted">Promo</span><span class="chip">${b.promo_percent}% off Vertt · −${chf(b.promo_chf)}</span></div>` : ""}
          <div class="between"><span class="muted">Travelcard</span><span class="chip">${NAMES[b.travelcard]}</span></div>
          <div class="between"><span class="muted">Payment</span><span class="chip">${PAY[b.payment_method] || esc(b.payment_method)}</span></div></div>
        <div class="card white stack"><div class="between"><h2 style="margin:0">Total</h2><span class="price">${b.promo_chf ? price(before, "was") : ""}${price(b.total_chf, "l")}</span></div>
          <span>Total CO₂ · ${kg(r.summary && r.summary.co2_kg ? r.summary.co2_kg.total : t.co2_kg)}</span></div>
        <div class="card white stack center"><button class="btn grey m" onclick="S.layer='settle';render()">Settlement data</button>
          <button class="link" ${n ? "" : "disabled"} onclick="exportAll()">Export all bookings</button>
          <button class="link s muted" onclick="saveIds([]);render()">Clear list (${n} booking${n === 1 ? "" : "s"} in this browser)</button></div>
        ${S.error ? alertBox("error", "Cancelling failed", S.error) : ""}</section>
      <div class="foot ${gone ? "" : "row"}">${gone ? "" : `<button class="btn outline" onclick="S.layer='cancel';render()">Cancel journey</button>`}
        <button class="btn" onclick="reset()">New booking</button></div>`; },
};

// sheets and dialogs on top of a screen
const LAYERS = {
  pay: () => `<div class="overlay" onclick="if(event.target===this){S.layer=null;render()}"><div class="sheet" role="dialog" aria-modal="true" aria-label="More payment options">
    <div class="between"><h2 style="margin:0">More payment options</h2><button class="iconbtn" aria-label="Close" onclick="S.layer=null;render()">${icon("x")}</button></div>
    <div class="paygrid">${MORE_PAY.map(m => `<button aria-pressed="${S.sheetPick === m}" aria-label="${PAY[m]}" class="${S.sheetPick === m ? "on" : ""} ${m === "postfinance" ? "pf" : ""}"
      onclick="S.sheetPick='${m}';render()">${PAY_LOGOS[m] ? `<img src="${PAY_LOGOS[m]}" alt="">` : "PostFinance<br>Card"}</button>`).join("")}</div>
    <button class="btn" ${S.sheetPick ? "" : "disabled"} onclick="S.morePay=S.pay=S.sheetPick;S.layer=null;render()">Select</button></div></div>`,

  cancel: () => `<div class="overlay" onclick="if(event.target===this){S.layer=null;render()}"><div class="sheet" role="alertdialog" aria-modal="true" aria-label="Cancel your booking?">
    <div class="between"><h2 style="margin:0">Cancel your booking?</h2><button class="iconbtn" aria-label="Close" onclick="S.layer=null;render()">${icon("x")}</button></div>
    <p style="margin:0">If you proceed, the whole journey is cancelled and you get ${chf(S.booking.booking.total_chf)} back.</p>
    <div class="stack" style="margin-top:24px"><button class="btn danger" onclick="cancelJourney()">Cancel journey</button>
      <button class="btn" onclick="S.layer=null;render()">Dismiss</button></div></div></div>`,

  settle: () => `<div class="overlay mid" onclick="if(event.target===this){S.layer=null;render()}"><div class="modal" role="dialog" aria-modal="true" aria-label="Settlement data">
    <div class="between"><h2 style="margin:0">Settlement data</h2><button class="iconbtn" aria-label="Close" onclick="S.layer=null;render()">${icon("x")}</button></div>
    <p class="muted" style="margin:0">Booking ${S.booking.booking.booking_id} – money flows between customer, Vertt and SBB.</p>
    <pre>${esc(JSON.stringify(S.booking, null, 2))}</pre>
    <button class="btn" onclick="copyText(JSON.stringify(S.booking, null, 2), 'settle')">${icon(S.copied === "settle" ? "check-circle" : "archive", 20)}${S.copied === "settle" ? "Copied" : "Copy"}</button>
    <button class="btn outline" onclick="S.layer=null;render()">Close</button></div></div>`,
};

// ---------- actions ----------
function typed(key, value) {
  S[key] = { text: value, pos: null, town: "" }; S.result = null; S.notFound[key] = false;
  document.getElementById("search").disabled = true;
  document.getElementById(`box-${key}`).classList.remove("err");
  document.getElementById(`err-${key}`).textContent = "";
  clearTimeout(timer);
  timer = setTimeout(async () => {
    if (value.trim().length < 3) { S.sugg[key] = []; showSugg(key); return; }
    const url = "https://api3.geo.admin.ch/rest/services/api/SearchServer?type=locations&origins=address&sr=4326&limit=5&searchText=" + encodeURIComponent(value);
    try {
      const res = (await (await fetch(url)).json()).results || [];
      S.sugg[key] = res.map(r => {          // label: "Dorfstrasse 1 <b>8907 Wettswil am Albis</b>"
        const [street, placeHtml = ""] = r.attrs.label.split("<b>"), plz = placeHtml.replace(/<[^>]+>/g, "").trim();
        return { street: street.trim(), plz, town: plz.replace(/^\d{4}\s*/, ""), pos: [r.attrs.lat, r.attrs.lon] };
      });
      S.notFound[key] = !S.sugg[key].length;
      document.getElementById(`box-${key}`).classList.toggle("err", S.notFound[key]);
      document.getElementById(`err-${key}`).textContent = S.notFound[key] ? "Address not found" : "";
      showSugg(key);
    } catch { document.getElementById(`sugg-${key}`).innerHTML = `<div class="sugg"><div class="none">Address search not reachable</div></div>`; }
  }, 250);
}
function showSugg(key) {
  const box = document.getElementById(`sugg-${key}`), input = document.getElementById(`in-${key}`), list = S.sugg[key];
  if (!box || document.activeElement !== input) return;
  const q = input.value.trim().toLowerCase();
  const mark = s => { const i = s.toLowerCase().indexOf(q); return i < 0 || !q ? esc(s) : esc(s.slice(0, i)) + "<b>" + esc(s.slice(i, i + q.length)) + "</b>" + esc(s.slice(i + q.length)); };
  box.innerHTML = list.length ? `<div class="sugg" role="listbox">${list.map((a, i) => `<button role="option" onmousedown="event.preventDefault();pick('${key}', ${i})">
    ${icon("location-pin", 20, "pin")}<span>${mark(a.street)}<small>${esc(a.plz)}, Switzerland</small></span></button>`).join("")}</div>` : "";
  input.setAttribute("aria-expanded", !!list.length);
  document.getElementById(`box-${key}`).classList.toggle("open", !!list.length);
}
function hideSugg(key) {
  const box = document.getElementById(`sugg-${key}`);
  if (box) { box.innerHTML = ""; document.getElementById(`box-${key}`).classList.remove("open"); }
}
function pick(key, i) { const a = S.sugg[key][i]; S[key] = { text: `${a.street}, ${a.town}`, pos: a.pos, town: a.town }; S.sugg[key] = []; document.activeElement.blur(); render(); }
function toggleCal() { const d = new Date(S.date + "T12:00"); S.cal = S.cal ? null : { y: d.getFullYear(), m: d.getMonth() }; render(); }
function moveCal(step) { const d = new Date(S.cal.y, S.cal.m + step, 1); S.cal = { y: d.getFullYear(), m: d.getMonth() }; render(); }
// a click outside the calendar closes it
document.addEventListener("mousedown", e => { if (S.cal && !e.target.closest(".cal, .datebtn")) { S.cal = null; render(); } });
document.addEventListener("keydown", e => { if (e.key === "Escape" && (S.cal || S.layer)) { S.cal = null; S.layer = null; render(); } });

function swissPassLogin() {
  if (S.spFrom === "login") { S.login = "swisspass"; go("overview"); return; }   // step 2: travelcard unchanged and not locked
  S.swisspass = true; S.login = "swisspass"; S.card = S.spCard; go(S.spFrom);
}
function removeSwissPass() { S.swisspass = false; if (S.login === "swisspass") S.login = null; render(); }
function promoTyped(value) {
  S.promoText = value.replace(/\D/g, "").slice(0, 2);
  const n = Number(S.promoText);
  S.promo = [5, 10, 20].includes(n) ? n : 0;
  render();
}
async function search() {
  S.error = null; S.result = null; S.open = {};
  go("searching");
  const departure = new Date(`${S.date}T${S.time}`).toISOString();
  const { data } = await api("/api/trips", { start: { lat: S.from.pos[0], lon: S.from.pos[1] }, destination: { lat: S.to.pos[0], lon: S.to.pos[1] }, departure });
  if (S.screen !== "searching") return;            // the user left the screen meanwhile
  if (["ok", "no_trip", "not_suitable"].includes(data.status)) { S.result = data; go("results"); }
  else { S.error = { status: data.status, message: data.message || "Search failed" }; go("plan"); }
}
async function pay() {
  S.error = null; go("paying");
  const started = Date.now();
  const { ok, data } = await api("/api/bookings", { action: "book", trip: trip(), system: S.app, travelcard: S.card,
                                                   promo_percent: S.promo, payment_method: S.pay, login_method: S.login || "email" });
  if (!ok) { S.error = data.message || "Booking failed"; go("overview"); return; }
  S.booking = data; saveIds([...ids(), data.booking.booking_id]);        // the booking exists from the click on "Pay"
  setTimeout(() => go("receipt"), Math.max(600, 1500 - (Date.now() - started)));
}
async function cancelJourney() {
  const { ok, data } = await api("/api/bookings", { action: "cancel", booking_id: S.booking.booking.booking_id });
  if (ok) { S.booking = data; S.error = null; } else S.error = data.message || data.status;
  S.layer = null; render();
}
async function copyText(text, what) {
  try { await navigator.clipboard.writeText(text); S.copied = what; } catch { prompt("Copy this:", text); }
  render(); setTimeout(() => { if (S.copied === what) { S.copied = null; render(); } }, 2000);
}
function shareBooking() { copyText(`${location.origin}/api/bookings?id=${S.booking.booking.booking_id}`, "share"); }
async function exportAll() {
  const all = (await Promise.all(ids().map(id => api(`/api/bookings?id=${id}`)))).filter(r => r.ok).map(r => r.data);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(all, null, 2)], { type: "application/json" }));
  a.download = "bookings.json"; a.click();
}

reset();
</script>
</body>
</html>
