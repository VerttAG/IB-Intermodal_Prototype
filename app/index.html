<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intermodal Booking App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    --bg: #F6F6F6; --card: #FFFFFF; --text: #212121; --muted: #6B6B6B; --line: #E4E4E4;
    --accent: #2D3E50; --accent-text: #FFFFFF; --danger: #A61B1B;
    --vertt: #5B4BB7; --sbb: #B42318; --walk: #6B7280; --radius: 6px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #E9E9E9; color: var(--text); font: 15px/1.45 Inter, "Helvetica Neue", Arial, sans-serif;
         display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 16px; }
  .phone { width: 390px; max-width: 100%; height: 820px; max-height: calc(100vh - 32px); background: var(--bg);
           border: 1px solid #D0D0D0; border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; }
  .bar { background: var(--card); padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; justify-content: space-between; }
  .bar b { font-weight: 700; } .bar span { font-size: 12px; color: var(--muted); }
  .demo { font-size: 11px; text-align: center; color: var(--muted); padding: 4px; border-bottom: 1px solid var(--line); }
  .screen { flex: 1; overflow-y: auto; padding: 16px; }
  h1 { font-size: 20px; margin: 0 0 12px; font-weight: 700; }
  h2 { font-size: 12px; margin: 18px 0 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 8px; }
  .card.click { cursor: pointer; } .card.cmp { color: var(--muted); }
  .btn { display: block; width: 100%; padding: 13px; border: 0; border-radius: var(--radius); background: var(--accent); color: var(--accent-text);
         font: inherit; font-weight: 600; cursor: pointer; margin-top: 10px; }
  .btn.secondary { background: var(--card); color: var(--text); border: 1px solid var(--line); }
  .btn.danger { background: var(--card); color: var(--danger); border: 1px solid var(--danger); }
  .btn:disabled { opacity: .35; cursor: not-allowed; }
  .field { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px 12px; margin-bottom: 8px; position: relative; }
  .field label { display: block; font-size: 12px; color: var(--muted); }
  .field input { width: 100%; border: 0; background: transparent; font: inherit; font-weight: 600; color: var(--text); padding: 2px 0; outline: none; }
  .sugg { position: absolute; left: -1px; right: -1px; top: 100%; background: var(--card); border: 1px solid var(--line); z-index: 500; }
  .sugg div { padding: 8px 12px; border-top: 1px solid var(--line); cursor: pointer; font-size: 14px; }
  .row2 { display: flex; gap: 8px; } .row2 .field { flex: 1; }
  .seg { display: flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--card); }
  .seg button { flex: 1; padding: 9px 4px; border: 0; border-left: 1px solid var(--line); background: transparent; font: inherit; font-size: 13px; cursor: pointer; color: var(--text); }
  .seg button:first-child { border-left: 0; } .seg button.on { background: var(--accent); color: var(--accent-text); }
  .seg button:disabled { cursor: not-allowed; }
  .row { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .times { font-size: 17px; font-weight: 700; }
  .muted { color: var(--muted); font-size: 13px; }
  .tag { display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 6px; border: 1px solid var(--accent); border-radius: 3px; color: var(--accent); margin-right: 4px; }
  .tag.grey { border-color: var(--line); color: var(--muted); }
  .bars { display: flex; gap: 2px; margin: 8px 0; height: 4px; } .bars span { border-radius: 2px; }
  .leg { border-left: 3px solid; padding: 2px 0 10px 10px; margin-left: 4px; }
  .leg.walk { border-left-style: dashed; }
  .mode { font-size: 11px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
  .gap { margin: 0 0 10px 17px; font-size: 13px; color: var(--muted); }
  .map { height: 210px; border-radius: var(--radius); border: 1px solid var(--line); margin-bottom: 8px; }
  .legend { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .legend i { display: inline-block; width: 12px; height: 3px; vertical-align: middle; margin-right: 4px; }
  .sum { border-top: 1px solid var(--line); margin-top: 6px; padding-top: 8px; font-weight: 700; }
  .opt { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); cursor: pointer; }
  .opt:first-child { border-top: 0; }
  .list { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); }
  .strike { text-decoration: line-through; color: var(--muted); }
  .center { text-align: center; padding-top: 120px; }
  .spinner { width: 40px; height: 40px; border: 4px solid var(--line); border-top-color: var(--accent); border-radius: 50%; margin: 0 auto 14px; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .note { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; font-size: 13px; margin: 8px 0; }
  .note.error { border-color: var(--danger); color: var(--danger); }
  a { color: var(--accent); }
</style>
</head>
<body>
<div class="phone">
  <div class="bar"><b id="app">Intermodal demo</b><span id="step"></span></div>
  <div class="demo">Local app – real timetable, prices from OJP Fare and the Vertt tariff</div>
  <div class="screen" id="screen"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
const NAMES = { none: "No travelcard", half: "Half-fare", ga: "GA" };
const COL = { vertt: "var(--vertt)", train: "var(--sbb)", walk: "var(--walk)" };
const HEX = { vertt: "#5B4BB7", train: "#B42318", walk: "#6B7280" };
const MODE = { vertt: "Vertt", train: "Train", walk: "Walk" };

// ---------- helpers ----------
const r05 = x => Math.round(x * 20) / 20;
const chf = x => "CHF " + Number(x).toFixed(2);
const kg = x => x == null ? "not available" : Number(x).toFixed(1) + " kg";
const hm = iso => iso ? iso.slice(11, 16) : "";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const seller = () => S.app === "vertt" ? "Vertt" : "SBB";
const ids = () => { try { return JSON.parse(localStorage.getItem("bookings") || "[]"); } catch { return []; } };
const saveIds = list => { try { localStorage.setItem("bookings", JSON.stringify(list)); } catch {} };
const pad = n => String(n).padStart(2, "0");

const NO_SERVER = "Server not reachable – start dev_server.py and open http://localhost:8000";
async function api(path, body) {
  const ctrl = new AbortController(), timeout = setTimeout(() => ctrl.abort(), 30000);
  try {
    const r = await fetch(path, { signal: ctrl.signal, ...(body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {}) });
    const data = await r.json().catch(() => ({ status: "error", message: "The server gave no answer" }));
    return { ok: r.ok, data };
  } catch (e) {          // no server, opened as a file, or no answer within 30 s
    return { ok: false, data: { status: "error", message: e.name === "AbortError" ? "The search took too long, please try again" : NO_SERVER } };
  } finally { clearTimeout(timeout); }
}

// ---------- state ----------
let S, maps = [], timer = null;
function reset() {
  const t = new Date(Date.now() + 15 * 60000); t.setMinutes(Math.ceil(t.getMinutes() / 15) * 15, 0, 0);
  S = { app: null, from: { text: "", pos: null }, to: { text: "", pos: null }, sugg: { from: [], to: [] },
        date: `${t.getFullYear()}-${pad(t.getMonth() + 1)}-${pad(t.getDate())}`, time: `${pad(t.getHours())}:${pad(t.getMinutes())}`,
        card: "half", swisspass: false, spFrom: null, spCard: null, login: null, promo: 0, pay: null,
        screen: "app", result: null, error: null, sel: null, booking: null };
  render();
}
function go(s) { S.screen = s; render(); }
const trip = () => S.result.trips[S.sel];

// ---------- prices (preview; the server recalculates when booking) ----------
function legPrice(l) { return l.kind === "vertt" ? r05(l.price_chf * (1 - S.promo / 100)) : 0; }
function trainPrice(t) { return S.card === "ga" ? 0 : S.card === "half" ? r05(t.train_price_half_chf) : r05(2 * t.train_price_half_chf); }
function total(t) { return r05(t.legs.reduce((s, l) => s + legPrice(l), 0) + trainPrice(t)); }

// ---------- rendering ----------
const STEP = { app: "Step 0", swisspass: "SwissPass", plan: "Step 1", detail: "Step 1", login: "Step 2", overview: "Step 3", paying: "", receipt: "Receipt" };
function render() {
  maps.forEach(m => m.remove()); maps = [];
  document.getElementById("app").textContent = S.app ? (S.app === "vertt" ? "Vertt app" : "SBB app") : "Intermodal demo";
  document.getElementById("step").textContent = STEP[S.screen];
  document.getElementById("screen").innerHTML = VIEWS[S.screen]();
  document.querySelectorAll("[data-map]").forEach(drawMap);
}
function minutesOf(l) {
  if (l.kind === "vertt") return l.ride_time_min;
  if (l.kind === "train") return (new Date(l.arrival) - new Date(l.departure)) / 60000;
  return l.minutes || 0;
}
function bars(legs) {
  return `<div class="bars">${legs.filter(l => COL[l.kind]).map(l => `<span style="flex:${Math.max(1, minutesOf(l))};background:${COL[l.kind]}"></span>`).join("")}</div>`;
}
function legsHtml(t) {
  let trainShown = false;
  return t.legs.map(l => {
    if (l.kind === "transfer") return `<div class="gap">Change trains – ${Math.round(l.minutes)} min</div>`;
    let detail, price = "", head;
    if (l.kind === "vertt") {
      head = `${hm(l.pickup)} ${esc(l.from === "start" ? "Start" : l.from)}`;
      const promo = S.promo && S.screen === "overview" ? ` · <span class="strike">${chf(l.price_chf)}</span> −${S.promo} %` : "";
      detail = `Category Vertt · ${esc(l.car.make)} ${esc(l.car.model)} ${l.car.year} · ${l.car.co2_g_per_km} g/km · ${l.distance_km.toFixed(1)} km${promo}`;
      price = chf(S.screen === "overview" ? legPrice(l) : l.price_chf);
    } else if (l.kind === "train") {
      head = `${hm(l.departure)} ${esc(l.from)}`;
      detail = `${esc(l.line)}${l.platform ? " · Platform " + esc(l.platform) : ""}`;
      if (!trainShown) { price = chf(trainPrice(t)); detail += S.card === "ga" ? " · covered by GA" : S.card === "half" ? " · half-fare price" : ""; trainShown = true; }
    } else {
      head = `${hm(l.departure)} ${esc(l.from === "start" ? "Start" : l.from)}`;
      detail = `${(l.distance_km * 1000).toFixed(0)} m on foot`;
    }
    const wait = l.kind === "vertt" ? `<div class="gap">Car arrives ${l.wait_min} min after ${l.from === "start" ? "your departure time" : "the train"}</div>` : "";
    return `${wait}<div class="leg ${l.kind}" style="border-color:${COL[l.kind]}">
      <div class="row"><span class="mode" style="color:${COL[l.kind]}">${MODE[l.kind]}</span><span>${price}</span></div>
      <div><b>${head}</b></div>
      <div class="muted">${detail} · ${Math.round(minutesOf(l))} min · CO₂ ${kg(l.co2_kg)}</div>
      <div><b>${hm(l.arrival)} ${esc(l.to === "destination" ? "Destination" : l.to)}</b></div></div>`;
  }).join("");
}
function mapHtml() {
  return `<div class="map" data-map></div><div class="legend"><span><i style="background:var(--vertt)"></i>Vertt</span>
    <span><i style="background:var(--sbb)"></i>Train</span><span><i style="background:var(--walk)"></i>Walk</span></div>`;
}
function drawMap(div) {
  const m = L.map(div, { zoomControl: false });
  L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 18, attribution: "© OpenStreetMap" }).addTo(m);
  const all = [];
  trip().legs.forEach(l => {
    if (!l.route || l.route.length < 2) return;
    L.polyline(l.route, { color: HEX[l.kind], weight: 4, dashArray: l.kind === "walk" ? "6 6" : null }).addTo(m);
    all.push(...l.route);
  });
  [S.from.pos, S.to.pos].forEach(p => L.circleMarker(p, { radius: 6, color: "#212121", weight: 2, fillColor: "#fff", fillOpacity: 1 }).addTo(m));
  const fit = () => { if (!div.clientWidth) return; m.invalidateSize(); m.fitBounds(all.length ? all : [S.from.pos, S.to.pos], { padding: [16, 16] }); };
  fit();
  new ResizeObserver(fit).observe(div);     // fit again once the map has a real size (e.g. page was in a background tab)
  maps.push(m);
}
function addrField(key, label) {
  return `<div class="field"><label>${label}</label>
    <input id="in-${key}" value="${esc(S[key].text)}" placeholder="Enter an address" autocomplete="off" oninput="typed('${key}', this.value)">
    <div id="sugg-${key}"></div></div>`;
}
function cardHtml(t, i) {
  const cars = t.legs.filter(l => l.kind === "vertt").map(l => `Car: ${esc(l.car.make)} ${esc(l.car.model)} · ${l.car.co2_g_per_km} g/km`);
  return `<div class="card click" onclick="S.sel=${i};go('detail')">
    <div>${t.labels[S.card].map(l => `<span class="tag">${l}</span>`).join("")}<span class="muted">Door to door with one booking</span></div>
    <div class="row" style="margin-top:6px"><span class="times">${hm(t.departure)} – ${hm(t.arrival)}</span>
      <span class="muted">${Math.floor(t.duration_min / 60)} h ${t.duration_min % 60} min · ${t.transfers} transfers</span></div>
    ${bars(t.legs)}${cars.length ? `<div class="muted">${cars.join(" &nbsp;|&nbsp; ")}</div>` : ""}
    <div class="row"><b>${chf(t.price_chf[S.card])}</b><span class="muted">CO₂ ${kg(t.co2_kg)}</span></div></div>`;
}
function results() {
  if (S.error) return `<div class="note error">${esc(S.error)}</div>`;
  const r = S.result;
  if (!r) return "";
  if (r.status !== "ok") return `<div class="note">${esc(r.message)}</div>`;
  const shown = r.trips.map((t, i) => [t, i]).filter(([t]) => t.labels[S.card].length);
  const vo = r.comparisons.vertt_only, pt = r.comparisons.public_transport_only;
  return `<h2>Connections</h2>${shown.map(([t, i]) => cardHtml(t, i)).join("")}
    ${vo ? `<div class="card cmp"><div><span class="tag grey">For comparison</span>Vertt only</div>
      <div class="row" style="margin-top:6px"><span class="times">${hm(vo.departure)} – ${hm(vo.arrival)}</span><span>${vo.distance_km.toFixed(0)} km by car</span></div>
      <div class="row"><b>${chf(vo.price_chf)}</b><span>CO₂ ${kg(vo.co2_kg)}</span></div></div>` : ""}
    ${/* not required by the spec (PRD-8 "Decisions") – shown to explain why it was dropped */ ""}
    ${pt ? `<div class="card cmp"><div><span class="tag grey">For comparison</span>Public transport only</div>
      <div class="row" style="margin-top:6px"><span class="times">${hm(pt.departure)} – ${hm(pt.arrival)}</span><span>${pt.transfers} transfers</span></div>
      <div class="row"><b>${chf(pt.price_chf[S.card])}</b><span>CO₂ ${kg(pt.co2_kg)}</span></div></div>` : ""}`;
}

const VIEWS = {
  app: () => `${!location.protocol.startsWith("http") ? `<div class="note error">${NO_SERVER}</div>` : ""}
    <h1>Where do you book?</h1><p class="muted">The choice is fixed until you pay or reload.</p>
    <button class="btn" onclick="S.app='vertt';go('plan')">Vertt app</button>
    <button class="btn secondary" onclick="S.app='sbb';go('plan')">SBB app</button>`,

  plan: () => `<h1>Plan your journey</h1>${addrField("from", "From")}${addrField("to", "To")}
    <div class="row2"><div class="field"><label>Depart at – date</label><input type="date" value="${S.date}" onchange="S.date=this.value;S.result=null;render()"></div>
      <div class="field"><label>Time</label><input type="time" value="${S.time}" onchange="S.time=this.value;S.result=null;render()"></div></div>
    <h2>Travelcard${S.swisspass ? " – from SwissPass" : ""}</h2>
    <div class="seg">${Object.keys(NAMES).map(c => `<button class="${S.card === c ? "on" : ""}" ${S.swisspass ? "disabled" : ""} onclick="S.card='${c}';render()">${NAMES[c]}</button>`).join("")}</div>
    ${S.swisspass ? "" : `<button class="btn secondary" onclick="S.spFrom='plan';go('swisspass')">Log in with SwissPass</button>`}
    <button class="btn" id="search" ${S.from.pos && S.to.pos ? "" : "disabled"} onclick="search()">Search</button>${results()}`,

  swisspass: () => `<h1>SwissPass</h1><p class="muted">Demo login – nothing to type.</p>
    <div class="field"><label>Email</label><input value="demo@swisspass.example" readonly></div>
    <div class="field"><label>Password</label><input type="password" value="demopassword" readonly></div>
    ${S.spFrom === "plan" ? `<h2>Test profile</h2><div class="list">${Object.keys(NAMES).map(c => `<label class="opt"><input type="radio" name="sp"
      ${S.spCard === c ? "checked" : ""} onchange="S.spCard='${c}';render()"> ${NAMES[c]}</label>`).join("")}</div>` : ""}
    <button class="btn" ${S.spFrom === "plan" && !S.spCard ? "disabled" : ""} onclick="swissPassLogin()">Log in</button>
    <button class="btn secondary" onclick="go(S.spFrom)">Cancel</button>`,

  detail: () => { const t = trip();
    return `<h1>Your trip</h1>${mapHtml()}<div class="card">${legsHtml(t)}
      <div class="row sum"><span>Total · CO₂ ${kg(t.co2_kg)}</span><span>${chf(t.price_chf[S.card])}</span></div></div>
      <button class="btn" onclick="go(S.swisspass ? 'overview' : 'login')">Continue</button>
      <button class="btn secondary" onclick="go('plan')">Back to connections</button>`; },

  login: () => `<h1>Log in</h1><p class="muted">One click – nothing to type in the demo.</p>
    ${["Google", "Apple"].map(p => `<button class="btn secondary" onclick="S.login='${p.toLowerCase()}';go('overview')">Continue with ${p}</button>`).join("")}
    <button class="btn secondary" onclick="S.spFrom='login';go('swisspass')">Continue with SwissPass</button>
    <h2>Or with email</h2><div class="field"><label>Email</label><input value="demo@example.com" readonly></div>
    <div class="field"><label>Password</label><input type="password" value="demopassword" readonly></div>
    <button class="btn" onclick="S.login='email';go('overview')">Log in</button>`,

  overview: () => { const t = trip();
    return `<h1>Overview</h1>${mapHtml()}<div class="card">${legsHtml(t)}
      <div class="row sum"><span>Total · CO₂ ${kg(t.co2_kg)}</span><span>${chf(total(t))}</span></div></div>
      <div class="note">You pay <b>${seller()}</b> for the whole journey. Travelcard: <b>${NAMES[S.card]}</b></div>
      <h2>Promo code (Vertt rides)</h2><div class="list">${[5, 10, 20].map(p => `<label class="opt"><input type="checkbox" ${S.promo === p ? "checked" : ""}
        onchange="S.promo=this.checked?${p}:0;render()"> ${p} % off Vertt rides</label>`).join("")}</div>
      <h2>Payment method</h2><div class="list">${["Card", "TWINT", "Invoice", "Business"].map(m => `<label class="opt"><input type="radio" name="pay"
        ${S.pay === m.toLowerCase() ? "checked" : ""} onchange="S.pay='${m.toLowerCase()}';render()"> ${m}</label>`).join("")}</div>
      ${S.error ? `<div class="note error">${esc(S.error)}</div>` : ""}
      <button class="btn" ${S.pay ? "" : "disabled"} onclick="pay()">Pay ${chf(total(t))}</button>`; },

  paying: () => `<div class="center"><div class="spinner"></div><b>Paying ${seller()} …</b></div>`,

  receipt: () => { const r = S.booking, b = r.booking, link = `${location.origin}/api/bookings?id=${b.booking_id}`, n = ids().length;
    return `<h1>${b.status === "cancelled" ? "Cancelled" : "Paid"}</h1>
      <div class="muted">Booking ${b.booking_id} · seller ${b.system === "vertt" ? "Vertt" : "SBB"}</div>
      <div class="card" style="margin-top:10px"><b>${esc(S.from.text)} – ${esc(S.to.text)}</b>
        ${r.legs.map(l => `<div class="row"><span>${l.type === "train" ? "Train" : "Vertt"}</span><span>${chf(l.amount_chf)}</span></div>`).join("")}
        ${b.promo_percent ? `<div class="muted">Promo ${b.promo_percent} % on Vertt rides: −${chf(b.promo_chf)}</div>` : ""}
        <div class="row sum"><span>Total</span><span>${chf(b.total_chf)}</span></div>
        <div class="muted">Travelcard ${NAMES[b.travelcard]} · payment ${b.payment_method} · login ${b.login_method}</div></div>
      ${b.status === "cancelled" ? `<div class="note">Refunded: <b>${chf(b.total_chf)}</b></div>` : ""}
      <div class="note">Settlement data (for project partners)<br><a href="${link}" target="_blank">${link}</a>
        <button class="btn secondary" onclick="navigator.clipboard.writeText('${link}').then(()=>this.textContent='Copied')">Copy link</button></div>
      ${S.error ? `<div class="note error">${esc(S.error)}</div>` : ""}
      ${b.status === "cancelled" ? "" : `<button class="btn danger" onclick="cancelJourney()">Cancel journey</button>`}
      <button class="btn secondary" onclick="reset()">New booking</button>
      <h2>Export (${n} booking${n === 1 ? "" : "s"} in this browser)</h2>
      <button class="btn secondary" onclick="exportAll()">Download all bookings</button>
      <button class="btn secondary" onclick="saveIds([]);render()">Clear list</button>`; },
};

// ---------- actions ----------
function typed(key, value) {
  S[key] = { text: value, pos: null }; S.result = null;
  document.getElementById("search").disabled = true;
  clearTimeout(timer);
  timer = setTimeout(async () => {
    const box = document.getElementById(`sugg-${key}`);
    if (value.trim().length < 3) { box.innerHTML = ""; return; }
    const url = "https://api3.geo.admin.ch/rest/services/api/SearchServer?type=locations&origins=address&sr=4326&limit=5&searchText=" + encodeURIComponent(value);
    try {
      const res = (await (await fetch(url)).json()).results || [];
      S.sugg[key] = res.map(r => ({ label: r.attrs.label.replace(/<[^>]+>/g, ""), pos: [r.attrs.lat, r.attrs.lon] }));
      box.innerHTML = S.sugg[key].length
        ? `<div class="sugg">${S.sugg[key].map((a, i) => `<div onmousedown="pick('${key}', ${i})">${esc(a.label)}</div>`).join("")}</div>`
        : `<div class="sugg"><div>Address not found</div></div>`;
    } catch { box.innerHTML = `<div class="sugg"><div>Address search not reachable</div></div>`; }
  }, 250);
}
function pick(key, i) { const a = S.sugg[key][i]; S[key] = { text: a.label, pos: a.pos }; S.sugg[key] = []; render(); }
function swissPassLogin() {
  S.swisspass = true; S.login = "swisspass";
  if (S.spFrom === "plan") { S.card = S.spCard; go("plan"); } else go("overview");
}
async function search() {
  S.error = null; S.result = null;
  const el = document.getElementById("search"); el.disabled = true; el.textContent = "Searching connections …";
  const departure = new Date(`${S.date}T${S.time}`).toISOString();
  const { data } = await api("/api/trips", { start: { lat: S.from.pos[0], lon: S.from.pos[1] }, destination: { lat: S.to.pos[0], lon: S.to.pos[1] }, departure });
  if (["ok", "no_trip", "not_suitable"].includes(data.status)) S.result = data; else S.error = data.message || "Search failed";
  render();
}
async function pay() {
  S.error = null; go("paying");
  const { ok, data } = await api("/api/bookings", { action: "book", trip: trip(), system: S.app, travelcard: S.card,
                                                   promo_percent: S.promo, payment_method: S.pay, login_method: S.login });
  if (!ok) { S.error = data.message || "Booking failed"; go("overview"); return; }
  S.booking = data; saveIds([...ids(), data.booking.booking_id]);        // the booking exists from the click on "Pay"
  setTimeout(() => go("receipt"), 600);
}
async function cancelJourney() {
  if (!confirm("Really cancel the whole journey?")) return;
  const { ok, data } = await api("/api/bookings", { action: "cancel", booking_id: S.booking.booking.booking_id });
  if (ok) { S.booking = data; S.error = null; } else S.error = data.status;
  render();
}
async function exportAll() {
  const all = (await Promise.all(ids().map(id => api(`/api/bookings?id=${id}`)))).filter(r => r.ok).map(r => r.data);
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(all, null, 2)], { type: "application/json" }));
  a.download = "bookings.json"; a.click();
}

reset();
</script>
